[package]
name = "acms-app"
version = "0.2.0"
edition = "2024"
description = "A pixel art editor: drawing tools, animation, tilemaps and Lua scripting"
license = "MIT OR Apache-2.0"

[dependencies]
acms-core = { version = "0.2.0", path = "../acms-core" }
acms-io = { version = "0.2.0", path = "../acms-io" }
acms-script = { version = "0.2.0", path = "../acms-script" }
anyhow = "1.0.104"
arboard = "3.6.1"
directories = "6.0.0"
eframe = "0.36.2"
egui = "0.36.2"
egui_dock = { version = "0.21.1", features = ["serde"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[lints]
workspace = true

[dev-dependencies]
gif = "0.14.2"

[build-dependencies]
winresource = "0.1.34"

# The Debian package, built with `cargo deb -p acms-app` (cargo-deb).
[package.metadata.deb]
name = "acms-mk3"
maintainer = "ACMS mk3 <https://github.com/OttoApocalypse69/ACMS-MK3>"
copyright = "MIT OR Apache-2.0"
extended-description = "A pixel art editor: pro drawing tools, animation, tilemaps for game art, and Lua scripting."
section = "graphics"
depends = "$auto"
assets = [
    ["target/release/acms-app", "usr/bin/acms-mk3", "755"],
    ["../../installer/linux/acms-mk3.desktop", "usr/share/applications/acms-mk3.desktop", "644"],
    ["../../installer/linux/acms-mk3.xml", "usr/share/mime/packages/acms-mk3.xml", "644"],
    ["../../assets/icon/acms-16.png", "usr/share/icons/hicolor/16x16/apps/acms-mk3.png", "644"],
    ["../../assets/icon/acms-24.png", "usr/share/icons/hicolor/24x24/apps/acms-mk3.png", "644"],
    ["../../assets/icon/acms-32.png", "usr/share/icons/hicolor/32x32/apps/acms-mk3.png", "644"],
    ["../../assets/icon/acms-48.png", "usr/share/icons/hicolor/48x48/apps/acms-mk3.png", "644"],
    ["../../assets/icon/acms-64.png", "usr/share/icons/hicolor/64x64/apps/acms-mk3.png", "644"],
    ["../../assets/icon/acms-128.png", "usr/share/icons/hicolor/128x128/apps/acms-mk3.png", "644"],
    ["../../assets/icon/acms-256.png", "usr/share/icons/hicolor/256x256/apps/acms-mk3.png", "644"],
    ["../../assets/icon/acms-512.png", "usr/share/icons/hicolor/512x512/apps/acms-mk3.png", "644"],
    ["../../README.md", "usr/share/doc/acms-mk3/README.md", "644"],
]
