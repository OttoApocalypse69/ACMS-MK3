[workspace]
resolver = "3"
members = [
    "crates/acms-core",
    "crates/acms-io",
    "crates/acms-script",
    "crates/acms-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

# The pixel loops (compositing, strokes) live in acms-core. Optimising just that crate keeps
# `cargo run` usable on large or many-layered sprites without slowing down rebuilds of the app.
[profile.dev.package.acms-core]
opt-level = 2
