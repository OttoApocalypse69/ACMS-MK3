name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The version comes from rust-toolchain.toml.
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  release:
    name: Release build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: acms-app
            artifact: acms-mk3-linux-x86_64
          - os: windows-latest
            binary: acms-app.exe
            artifact: acms-mk3-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release -p acms-app
      # How long flattening a large sprite takes here, for the record. The 120 fps budget
      # itself is checked on a developer's machine (see README): shared runners are too
      # uneven to hold a timing test to.
      - run: cargo test --release -p acms-core -- --ignored time_to_flatten --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
